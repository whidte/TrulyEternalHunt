modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="trulyeternalhunt"
version="${mod_version}"
displayName="真正永恒的狩猎"
authors="whidte"
description='''让宠物类物品改为依据「真正永恒的伙伴」的宠物记录来判定。
两个联动目标都是可选的，可以只装其中一个：
- 血腥狩猎手册（安装 Enigmatic Legacy+ 时生效）：只有被 TBF 收录、且主人是该玩家的宠物，才能获得手册的宠物攻击伤害与速度加成；
- Relics 猎手腰带（安装 Relics 时生效）：伤害加成、队长减伤、宠物经验与复活宠物骨也改按 TBF 记录判定；
- 宠物骨（安装 Relics 时生效）：TBF 记录的死亡同样掉落宠物骨，骨头改用 TBF 的方式复活，掉骨期间禁止 TBF 常规复活，
  并且玩家与其 TBF 宠物的击杀都会为骨头充能。'''

[[dependencies.trulyeternalhunt]]
    modId="neoforge"
    type="required"
    versionRange="[21.1.228,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.trulyeternalhunt]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.trulyeternalhunt]]
    modId="trulybestfriends"
    type="required"
    versionRange="[0.2.6,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.trulyeternalhunt]]
    modId="enigmaticlegacyplus"
    type="optional"
    versionRange="[1.0.0,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.trulyeternalhunt]]
    modId="curios"
    type="required"
    versionRange="[9.5.0,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.trulyeternalhunt]]
    modId="relics"
    type="optional"
    versionRange="[0.12.10,)"
    ordering="AFTER"
    side="BOTH"
